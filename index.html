<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPizzaria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">EduPizzaria</div>
    <div class="saldo">Saldo de Moedas: <strong id="moedas">0</strong></div>
  </header>

  <aside class="sidebar" id="ingredientes"></aside>

  <main class="mesa" id="mesa">
    <div class="pizza-area">
      <div id="pizza" class="pizza">
        <div id="cobertura-pizza" class="cobertura-pizza"></div>
      </div>
    </div>

    <section id="estacao-pedido" class="estacao ativa">
      <button id="btn-anotar" class="btn-mesa">Anotar Pedido</button>
    </section>

    <section id="estacao-montagem" class="estacao">
      <p class="instrucao-mesa">Escolha o ingrediente correto na barra lateral.</p>
      <button id="btn-ir-forno" class="btn-mesa" disabled>Ir ao Forno</button>
    </section>

    <section id="estacao-forno" class="estacao">
      <p class="instrucao-mesa">Asse a pizza no ponto certo!</p>
      <div class="acoes-forno">
        <button id="btn-assar" class="btn-mesa">Assar</button>
        <button id="btn-retirar" class="btn-mesa" disabled>Retirar</button>
      </div>
    </section>

    <section id="estacao-corte" class="estacao">
      <p class="instrucao-mesa">Corte a pizza em fatias.</p>
      <button id="btn-cortar" class="btn-mesa">Cortar Pizza</button>
    </section>

    <section id="estacao-entrega" class="estacao">
      <p class="instrucao-mesa">A pizza está pronta!</p>
      <button id="btn-entregar" class="btn-mesa">Entregar</button>
    </section>
  </main>

  <aside class="comanda" id="comanda">
    <h2>Comanda</h2>
    <p id="texto-comanda" class="pergunta-destaque"></p>
    <div id="area-timer" class="area-timer oculto">
      <p class="timer-label">Tempo no forno</p>
      <div class="barra-timer">
        <div id="progresso-timer" class="progresso-timer"></div>
      </div>
    </div>
    <p id="msg-comanda" class="msg-comanda"></p>
  </aside>

  <script src="script.js"></script>
</body>
</html>
