<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPizzaria - Aventura na Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="tela-menu" class="tela ativa">
            <div class="cena-menu">
                <div class="menu-decor menu-decor-esquerda"></div>
                <div class="menu-decor menu-decor-direita"></div>
                <div class="menu-conteudo">
                    <div class="logo-pizza">
                        <div class="logo-molho"></div>
                        <div class="logo-queijo"></div>
                        <span class="logo-topping logo-topping-1"></span>
                        <span class="logo-topping logo-topping-2"></span>
                        <span class="logo-topping logo-topping-3"></span>
                    </div>
                    <h1>EduPizzaria</h1>
                    <p>Aprenda enquanto faz a melhor pizza da cidade!</p>
                    <button id="btn-iniciar" class="btn-primario">Abrir a loja</button>
                    <div class="menu-assinatura">Massa, molho e conhecimento</div>
                </div>
            </div>
        </section>

        <section id="tela-cliente" class="tela">
            <header class="hud">
                <div class="hud-item hud-dia"><span class="hud-icone">☀️</span>DAY <span class="hud-dia-numero">1</span></div>
                <div class="hud-item hud-item-centro hud-pedido"><span class="hud-icone">🍕</span><span class="hud-pedido-numero">1</span></div>
                <div class="hud-item hud-dinheiro"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
            </header>
            <div class="cena-loja">
                <div class="parede-madeira"></div>
                <div class="piso-verde"></div>

                <div class="fliperama fliperama-azul">
                    <div class="fliperama-tela"></div>
                    <span>BOLHA<br>ZAP</span>
                </div>
                <div class="fliperama fliperama-rosa">
                    <div class="fliperama-tela"></div>
                    <span>ESTRELA<br>POP</span>
                </div>
                <div class="cabideiro">
                    <i></i>
                    <span class="cabide cabide-1"></span>
                    <span class="cabide cabide-2"></span>
                </div>

                <div class="mesa-fundo mesa-fundo-1">
                    <div class="toalha"></div>
                    <div class="prato"></div>
                    <div class="cadeira cadeira-esquerda"></div>
                    <div class="cadeira cadeira-direita"></div>
                </div>
                <div class="mesa-fundo mesa-fundo-2">
                    <div class="toalha"></div>
                    <div class="prato"></div>
                    <div class="cadeira cadeira-esquerda"></div>
                    <div class="cadeira cadeira-direita"></div>
                </div>

                <div class="cliente-cena">
                    <div class="balao-fala" id="balao-cliente">Carregando pedido...</div>
                    <div class="cliente" id="avatar-cliente">
                        <div class="cliente-cabelo"></div>
                        <div class="cliente-cabeca">
                            <span class="cliente-orelha cliente-orelha-esquerda"></span>
                            <span class="cliente-orelha cliente-orelha-direita"></span>
                            <span class="cliente-sobrancelha cliente-sobrancelha-esquerda"></span>
                            <span class="cliente-sobrancelha cliente-sobrancelha-direita"></span>
                            <span class="cliente-olho cliente-olho-esquerdo"></span>
                            <span class="cliente-olho cliente-olho-direito"></span>
                            <span class="cliente-bochecha cliente-bochecha-esquerda"></span>
                            <span class="cliente-bochecha cliente-bochecha-direita"></span>
                            <span class="cliente-boca"></span>
                        </div>
                        <div class="cliente-corpo"><span class="cliente-gola"></span></div>
                    </div>
                </div>

                <div class="balcao">
                    <div class="objeto-balcao registradora">
                        <div class="registradora-tela"></div>
                        <div class="registradora-botoes"></div>
                    </div>
                    <div class="objeto-balcao pote-dinheiro">
                        <div class="pote-vidro"><span>🪙</span></div>
                    </div>
                    <div class="objeto-balcao tabua-pizza">
                        <div class="pizza-fatia"><span></span></div>
                    </div>
                    <div class="objeto-balcao molhos">
                        <div class="pote-molho molho-amarelo"></div>
                        <div class="pote-molho molho-verde"></div>
                        <div class="pote-molho molho-vermelho"></div>
                    </div>
                    <div class="objeto-balcao tablet">
                        <span>!</span>
                    </div>
                </div>
                <button id="btn-anotar" class="btn-primario btn-balcao">Anotar pedido</button>
            </div>
        </section>

        <section id="tela-cozinha" class="tela">
            <header class="hud">
                <div class="hud-item hud-dia"><span class="hud-icone">☀️</span>DAY <span class="hud-dia-numero">1</span></div>
                <div class="hud-item hud-item-centro hud-pedido"><span class="hud-icone">🍕</span><span class="hud-pedido-numero">1</span></div>
                <div class="hud-item hud-dinheiro"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
            </header>
            <div class="cozinha">
                <div class="azulejo"></div>
                <div class="comanda">
                    <h3>Pedido</h3>
                    <p id="texto-pedido-cozinha">Quanto é...</p>
                </div>
                <div class="estacao-montagem">
                    <div class="mesa">
                        <div class="tabua">
                            <div id="pizza" class="pizza pizza-vazia">
                                <div class="pizza-molho"></div>
                                <div class="pizza-queijo"></div>
                                <div class="pizza-toppings"></div>
                            </div>
                        </div>
                    </div>
                    <div id="ingredientes" class="bandeja"></div>
                </div>
                <div id="feedback" class="feedback-msg" aria-live="polite"></div>
            </div>
        </section>

        <section id="tela-forno" class="tela">
            <header class="hud">
                <div class="hud-item hud-dia"><span class="hud-icone">☀️</span>DAY <span class="hud-dia-numero">1</span></div>
                <div class="hud-item hud-item-centro hud-pedido"><span class="hud-icone">🍕</span><span class="hud-pedido-numero">1</span></div>
                <div class="hud-item hud-dinheiro"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
            </header>
            <div class="cena-forno">
                <div class="forno" id="forno">
                    <div class="forno-chamine"></div>
                    <div class="forno-janela">
                        <div id="pizza-forno" class="pizza-forno"></div>
                    </div>
                    <div class="forno-painel">
                        <div class="medidor"><div id="barra-forno" class="medidor-barra"></div></div>
                        <span id="texto-forno">Ligando...</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="tela-entrega" class="tela">
            <header class="hud">
                <div class="hud-item hud-dia"><span class="hud-icone">☀️</span>DAY <span class="hud-dia-numero">1</span></div>
                <div class="hud-item hud-item-centro hud-pedido"><span class="hud-icone">🍕</span><span class="hud-pedido-numero">1</span></div>
                <div class="hud-item hud-dinheiro"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
            </header>
            <div class="cena-entrega">
                <div class="cliente cliente-entrega">
                    <div class="cliente-cabelo"></div>
                    <div class="cliente-cabeca">
                        <span class="cliente-orelha cliente-orelha-esquerda"></span>
                        <span class="cliente-orelha cliente-orelha-direita"></span>
                        <span class="cliente-sobrancelha cliente-sobrancelha-esquerda"></span>
                        <span class="cliente-sobrancelha cliente-sobrancelha-direita"></span>
                        <span class="cliente-olho cliente-olho-esquerdo"></span>
                        <span class="cliente-olho cliente-olho-direito"></span>
                        <span class="cliente-bochecha cliente-bochecha-esquerda"></span>
                        <span class="cliente-bochecha cliente-bochecha-direita"></span>
                        <span class="cliente-boca"></span>
                    </div>
                    <div class="cliente-corpo"><span class="cliente-gola"></span></div>
                </div>
                <div class="comanda-entrega">
                    <h2 id="titulo-entrega">Pedido entregue!</h2>
                    <p id="texto-entrega">O cliente ficou feliz.</p>
                    <div class="moeda-ganha" id="moeda-ganha">+10 🪙</div>
                    <button id="btn-proximo" class="btn-primario">Próximo cliente</button>
                </div>
            </div>
        </section>
    </div>
    <script src="perguntas.js"></script>
    <script src="script.js"></script>
</body>
</html>
