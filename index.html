<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Topo: Informações e Cliente -->
    <header class="top-bar">
        <h1>🍕 EduPizzaria</h1>
        <div class="status">
            <span>Dia: 1</span>
            <span>Pedido: 1</span>
            <span>Moedas: <strong id="moedas">0</strong></span>
        </div>
    </header>

    <main class="game-container">
        <!-- Balcão do Cliente -->
        <section class="counter">
            <div class="customer-icon">👨‍🍳</div>
            <div class="speech-bubble">
                <p id="texto-pedido">Carregando...</p>
            </div>
        </section>

        <!-- Estações -->
        <section id="estacao-pedido" class="estacao ativa">
            <h2>Estação 1 - Pedido</h2>
            <p>Anote o pedido do cliente.</p>
            <button id="btn-anotar" class="btn-acao">Anotar Pedido</button>
        </section>

        <section id="estacao-montagem" class="estacao">
            <h2>Estação 2 - Montagem</h2>
            <div class="pizza-container">
                <div id="pizza-montagem" class="pizza"></div>
            </div>
            <p>Escolha a resposta correta:</p>
            <div id="opcoes-ingredientes" class="opcoes-container"></div>
        </section>

        <section id="estacao-forno" class="estacao">
            <h2>Estação 3 - Forno</h2>
            <div class="pizza-container">
                <div id="pizza-forno" class="pizza"></div>
            </div>
            <p>Asse a pizza no ponto certo!</p>
            <div class="barra-container">
                <div id="barra-forno" class="barra-progresso"></div>
            </div>
            <button id="btn-assar" class="btn-acao">Colocar no Forno</button>
        </section>

        <section id="estacao-corte" class="estacao">
            <h2>Estação 4 - Corte</h2>
            <div class="pizza-container">
                <div id="pizza-corte" class="pizza"></div>
            </div>
            <button id="btn-cortar" class="btn-acao">Cortar Pizza</button>
        </section>
        
        <section id="estacao-entrega" class="estacao">
            <h2>Estação 5 - Entrega</h2>
            <p>O cliente está esperando!</p>
            <button id="btn-entregar" class="btn-acao">Entregar Pedido</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
