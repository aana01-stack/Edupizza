<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPizzaria - Good Pizza Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="tela-menu" class="tela ativa">
            <div class="cena-menu">
                <div class="menu-decor menu-decor-esquerda"></div>
                <div class="menu-decor menu-decor-direita"></div>
                <div class="menu-conteudo">
                    <div class="logo-pizza">
                        <div class="logo-molho"></div>
                        <div class="logo-queijo"></div>
                        <span class="logo-topping logo-topping-1"></span>
                        <span class="logo-topping logo-topping-2"></span>
                        <span class="logo-topping logo-topping-3"></span>
                    </div>
                    <h1>EduPizzaria</h1>
                    <p>Aprenda enquanto faz a melhor pizza da cidade!</p>
                    <button id="btn-iniciar" class="btn-primario">Abrir a loja</button>
                    <div class="menu-assinatura">Massa, molho e conhecimento</div>
                </div>
            </div>
        </section>

        <section id="tela-cliente" class="tela">
            <header class="hud">
                <div class="hud-item"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
                <div class="hud-item hud-item-centro"><span class="hud-icone">⭐</span><span class="hud-nivel">1</span></div>
                <div class="hud-item">Dia 1</div>
            </header>
            <div class="cena-loja">
                <div class="janela">
                    <div class="janela-nuvem janela-nuvem-1"></div>
                    <div class="janela-nuvem janela-nuvem-2"></div>
                    <div class="janela-morro"></div>
                </div>
                <div class="quadro">🍕</div>
                <div class="planta"><span></span><span></span><span></span><i></i></div>
                <div class="cliente-cena">
                    <div class="balao-fala" id="balao-cliente">Carregando pedido...</div>
                    <div class="cliente" id="avatar-cliente">
                        <div class="cliente-cabelo"></div>
                        <div class="cliente-cabeca">
                            <span class="cliente-olho cliente-olho-esquerdo"></span>
                            <span class="cliente-olho cliente-olho-direito"></span>
                            <span class="cliente-boca"></span>
                        </div>
                        <div class="cliente-corpo"></div>
                    </div>
                </div>
                <div class="balcao"></div>
                <button id="btn-anotar" class="btn-primario btn-balcao">Anotar pedido</button>
            </div>
        </section>

        <section id="tela-cozinha" class="tela">
            <header class="hud">
                <div class="hud-item"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
                <div class="hud-item hud-item-centro"><span class="hud-icone">⭐</span><span class="hud-nivel">1</span></div>
                <div class="hud-item">Cozinha</div>
            </header>
            <div class="cozinha">
                <div class="azulejo"></div>
                <div class="comanda">
                    <h3>Pedido</h3>
                    <p id="texto-pedido-cozinha">Quanto é...</p>
                </div>
                <div class="estacao-montagem">
                    <div class="mesa">
                        <div class="tabua">
                            <div id="pizza" class="pizza pizza-vazia">
                                <div class="pizza-molho"></div>
                                <div class="pizza-queijo"></div>
                                <div class="pizza-toppings"></div>
                            </div>
                        </div>
                    </div>
                    <div id="ingredientes" class="bandeja"></div>
                </div>
                <div id="feedback" class="feedback-msg" aria-live="polite"></div>
            </div>
        </section>

        <section id="tela-forno" class="tela">
            <header class="hud">
                <div class="hud-item"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
                <div class="hud-item hud-item-centro"><span class="hud-icone">⭐</span><span class="hud-nivel">1</span></div>
                <div class="hud-item">Forno</div>
            </header>
            <div class="cena-forno">
                <div class="forno" id="forno">
                    <div class="forno-chamine"></div>
                    <div class="forno-janela">
                        <div id="pizza-forno" class="pizza-forno"></div>
                    </div>
                    <div class="forno-painel">
                        <div class="medidor"><div id="barra-forno" class="medidor-barra"></div></div>
                        <span id="texto-forno">Ligando...</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="tela-entrega" class="tela">
            <header class="hud">
                <div class="hud-item"><span class="hud-icone">🪙</span><span class="hud-moedas">10</span></div>
                <div class="hud-item hud-item-centro"><span class="hud-icone">⭐</span><span class="hud-nivel">1</span></div>
                <div class="hud-item">Entrega</div>
            </header>
            <div class="cena-entrega">
                <div class="cliente cliente-entrega">
                    <div class="cliente-cabelo"></div>
                    <div class="cliente-cabeca">
                        <span class="cliente-olho cliente-olho-esquerdo"></span>
                        <span class="cliente-olho cliente-olho-direito"></span>
                        <span class="cliente-boca"></span>
                    </div>
                    <div class="cliente-corpo"></div>
                </div>
                <div class="comanda-entrega">
                    <h2 id="titulo-entrega">Pedido entregue!</h2>
                    <p id="texto-entrega">O cliente ficou feliz.</p>
                    <div class="moeda-ganha" id="moeda-ganha">+10 🪙</div>
                    <button id="btn-proximo" class="btn-primario">Próximo cliente</button>
                </div>
            </div>
        </section>
    </div>
    <script src="perguntas.js"></script>
    <script src="script.js"></script>
</body>
</html>
