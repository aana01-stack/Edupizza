<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPizzaria - Estilo Papa's</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', cursive, sans-serif; }
        body { background-color: #333; height: 100vh; overflow: hidden; }

        /* --- TELA INICIAL --- */
        .tela-inicial {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #4CAF50;
            background-image: linear-gradient(45deg, #388E3C 25%, transparent 25%, transparent 75%, #388E3C 75%, #388E3C), linear-gradient(45deg, #388E3C 25%, transparent 25%, transparent 75%, #388E3C 75%, #388E3C);
            background-size: 100px 100px; background-position: 0 0, 50px 50px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s;
        }
        .tela-inicial.escondida { opacity: 0; pointer-events: none; }
        .logo-inicial h1 { font-size: 80px; color: #d32f2f; text-shadow: 4px 4px 0 #fff, 8px 8px 0 #000; background: white; padding: 20px 50px; border-radius: 50%; border: 10px solid #d32f2f; transform: rotate(-5deg); margin-bottom: 20px; text-align: center;}
        .logo-inicial p { color: white; font-size: 24px; text-shadow: 2px 2px 0 #000; margin-bottom: 40px; font-weight: bold; text-align: center; }
        .menu-inicial { display: flex; flex-direction: column; gap: 15px; }
        .menu-inicial button { background: #ffca28; color: #5d4037; font-size: 24px; font-weight: bold; padding: 15px 50px; border: 4px solid #ff8f00; border-radius: 50px; box-shadow: 0 6px 0 #b26500; cursor: pointer; transition: 0.1s; }
        .menu-inicial button:active { transform: translateY(6px); box-shadow: none; }

        /* --- JOGO PRINCIPAL --- */
        .jogo-principal { display: flex; flex-direction: column; height: 100vh; }
        header { background: #e0e0e0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #a0a0a0; }
        header h1 { color: #d32f2f; font-size: 24px; }
        .stats { background: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 2px solid #ccc; }

        .game-layout { display: grid; grid-template-columns: 140px 1fr 250px; height: calc(100vh - 60px); gap: 10px; padding: 10px; background: #222; }
        .sidebar { background: #444; border-radius: 10px; padding: 15px 10px; display: flex; flex-direction: column; gap: 15px; align-items: center; overflow-y: auto; }
        .btn-ingrediente { width: 90px; height: 90px; border-radius: 50%; background: #ffca28; border: 4px solid #ff8f00; box-shadow: 0 6px 0 #b26500; cursor: pointer; font-size: 30px; font-weight: bold; display: flex; justify-content: center; align-items: center; transition: 0.1s; color: #333; }
        .btn-ingrediente:active { transform: translateY(6px); box-shadow: 0 0 0 #b26500; }
        .btn-ingrediente:disabled { background: #888; border-color: #666; box-shadow: 0 6px 0 #444; cursor: not-allowed; }

        /* Área Central */
        .workspace { background: #eab676; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 20px, transparent 20px, transparent 40px); border-radius: 15px; display: flex; justify-content: center; align-items: center; position: relative; border: 8px solid #555; overflow: hidden; }
        .estacao { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
        .estacao.ativa { display: flex; }

        /* Estação 1 (Lobby) */
        .lobby { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
        .fila-clientes { flex-grow: 1; display: flex; justify-content: center; align-items: flex-end; gap: 20px; padding-bottom: 20px; }
        
        /* Balcão de Atendimento */
        .balcao-atendimento { background: #8B4513; width: 100%; height: 120px; border-top: 10px solid #5d2e0c; border-radius: 20px 20px 0 0; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 10px 20px rgba(0,0,0,0.3); position: relative; }
        
        /* A Placa OPEN no meio do balcão */
        .btn-open { 
            background: #4CAF50; color: white; font-size: 28px; font-weight: bold; 
            padding: 15px 40px; border: 4px solid #2E7D32; border-radius: 10px; 
            cursor: pointer; box-shadow: 0 6px 0 #1b5e20, 0 10px 10px rgba(0,0,0,0.5); 
            transition: transform 0.2s, box-shadow 0.2s;
            transform: rotate(-3deg); /* Placa inclinada como no jogo */
        }
        .btn-open:active { transform: translateY(6px) rotate(-3deg); box-shadow: 0 0 0 #1b5e20, 0 2px 5px rgba(0,0,0,0.5); }
        .btn-open.fechada { display: none; }

        /* Comanda Flutuante */
        .comanda-fisica { background: #fff; width: 80px; height: 100px; position: absolute; top: -60px; border-radius: 5px; box-shadow: 0 5px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border-left: 4px solid #d32f2f; transition: transform 0.2s; animation: flutuar 2s infinite ease-in-out; }
        .comanda-fisica:hover { transform: scale(1.1) rotate(5deg); }
        @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Pizza e Forno */
        .pizza-area { width: 250px; height: 250px; background-color: #f9e79f; border-radius: 50%; box-shadow: 0 15px 30px rgba(0,0,0,0.5); border: 12px solid #e67e22; position: relative; display: flex; justify-content: center; align-items: center; transition: 0.5s; }
        .pizza-area.dourada { background-color: #f39c12; }
        .pizza-area.queimada { background-color: #333; border-color: #111; }
        .forno { width: 350px; height: 350px; background: #555; border-radius: 20px; display: flex; justify-content: center; align-items: center; border: 15px solid #333; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        .linha-corte { position: absolute; background: rgba(255,255,255,0.8); height: 100%; width: 4px; top: 0; left: 50%; transform: translateX(-50%); }
        .linha-corte.horizontal { width: 100%; height: 4px; top: 50%; left: 0; transform: translateY(-50%); }
        .btn-acao { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; box-shadow: 0 5px 0 #2E7D32; cursor: pointer; margin-top: 20px; font-weight: bold; transition: 0.1s; }
        .btn-acao:active { transform: translateY(5px); box-shadow: none; }
        .btn-acao:disabled { background: #888; box-shadow: 0 5px 0 #555; cursor: not-allowed; }

        /* Comanda Direita */
        .ticket { background: #fff; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; border-left: 8px solid #e91e63; box-shadow: -5px 5px 15px rgba(0,0,0,0.3); }
        .ticket h2 { font-size: 20px; color: #333; margin-bottom: 15px; border-bottom: 2px dashed #ccc; padding-bottom: 10px; }
        .ticket-pedido { font-size: 18px; color: #d32f2f; font-weight: bold; line-height: 1.4; }
        .barra-container { width: 80%; height: 25px; background: #ddd; border-radius: 15px; margin-top: 20px; overflow: hidden; border: 2px solid #aaa; }
        .barra-progresso { width: 0%; height: 100%; background: #4CAF50; transition: width 0.1s linear, background-color 0.3s; }
    </style>
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="tela-inicial" class="tela-inicial">
        <div class="logo-inicial">
            <h1>EduPizzaria</h1>
            <p>Aprender nunca foi tão saboroso!</p>
        </div>
        <div class="menu-inicial">
            <button onclick="iniciarJogo()">Start Game</button>
            <button>Help</button>
            <button>Credits</button>
        </div>
    </div>

    <!-- JOGO PRINCIPAL -->
    <div id="jogo-principal" class="jogo-principal" style="display: none;">
        <header>
            <h1>🍕 EduPizzaria</h1>
            <div class="stats">Moedas: <span id="moedas">0</span></div>
        </header>

        <div class="game-layout">
            <div class="sidebar" id="sidebar-ingredientes"></div>

            <div class="workspace">
                <!-- Tela 1: Pedido (Lobby) -->
                <div id="estacao-pedido" class="estacao ativa">
                    <div class="lobby">
                        <div class="fila-clientes" id="fila-clientes"></div>
                        <div class="balcao-atendimento">
                            <!-- Placa OPEN no meio -->
                            <button id="btn-open" class="btn-open" onclick="abrirPizzaria()">OPEN</button>
                            
                            <!-- Comanda que aparece após o OPEN -->
                            <div class="comanda-fisica" id="comanda-fisica" onclick="pegarComanda()" style="display: none;">
                                <p style="font-size: 14px; font-weight: bold; color: #d32f2f;">PEDIDO</p>
                                <p style="font-size: 10px; color: #888; margin-top: 5px;">Clique</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tela 2: Montagem -->
                <div id="estacao-montagem" class="estacao">
                    <div class="pizza-area" id="pizza-montagem"></div>
                    <button class="btn-acao" onclick="irParaForno()" id="btn-montagem-feita" style="display:none;">Ir para o Forno</button>
                </div>

                <!-- Tela 3: Forno -->
                <div id="estacao-forno" class="estacao">
                    <div class="forno">
                        <div class="pizza-area" id="pizza-forno"></div>
                    </div>
                    <div class="barra-container">
                        <div id="barra-forno" class="barra-progresso"></div>
                    </div>
                    <button class="btn-acao" id="btn-forno" onclick="acionarForno()">Colocar no Forno</button>
                </div>

                <!-- Tela 4: Corte -->
                <div id="estacao-corte" class="estacao">
                    <div class="pizza-area">
                        <div class="linha-corte"></div>
                        <div class="linha-corte horizontal"></div>
                    </div>
                    <button class="btn-acao" onclick="entregarPizza()">Entregar Pedido</button>
                </div>
            </div>

            <div class="ticket">
                <h2>Comanda</h2>
                <div class="ticket-pedido" id="texto-pedido">Aguardando...</div>
                <p style="font-size: 12px; color: #888; margin-top: auto;">Status: <span id="status-ticket">Aguardando...</span></p>
            </div>
        </div>
    </div>

    <script>
        const bancoDePerguntas = [
            { pergunta: "Quanto é 7 x 8?", opcoes: ["48", "56", "64", "72"], correta: "56" },
            { pergunta: "Qual é a capital da França?", opcoes: ["Paris", "Londres", "Berlim", "Roma"], correta: "Paris" },
            { pergunta: "Quem descobriu o Brasil?", opcoes: ["Cabral", "Colombo", "Dom Pedro", "Vasco"], correta: "Cabral" }
        ];

        let perguntaAtual = null;
        let moedas = 0;
        let tempoForno = 0;
        let intervalForno = null;
        let pizzariaAberta = false;

        const ui = {
            sidebar: document.getElementById('sidebar-ingredientes'),
            textoPedido: document.getElementById('texto-pedido'),
            moedas: document.getElementById('moedas'),
            pizzaMontagem: document.getElementById('pizza-montagem'),
            pizzaForno: document.getElementById('pizza-forno'),
            barraForno: document.getElementById('barra-forno'),
            btnForno: document.getElementById('btn-forno'),
            statusTicket: document.getElementById('status-ticket'),
            filaClientes: document.getElementById('fila-clientes'),
            btnOpen: document.getElementById('btn-open'),
            comandaFisica: document.getElementById('comanda-fisica')
        };

        function iniciarJogo() {
            document.getElementById('tela-inicial').classList.add('escondida');
            document.getElementById('jogo-principal').style.display = 'flex';
        }

        // Quando o jogador clica em OPEN
        function abrirPizzaria() {
            if (pizzariaAberta) return;
            pizzariaAberta = true;
            
            // Esconde a placa OPEN
            ui.btnOpen.classList.add('fechada');
            
            // Faz os clientes entrarem na fila um por um
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const cliente = document.createElement('div');
                    cliente.style.fontSize = '80px';
                    cliente.innerText = ['👨‍🍳', '👩‍🦰', '🧔'][i];
                    cliente.style.cursor = 'pointer';
                    // Quando clicar no cliente, ele faz o pedido
                    cliente.onclick = () => atenderCliente();
                    ui.filaClientes.appendChild(cliente);
                }, i * 800); // 800ms de intervalo entre um cliente e outro
            }
        }

        // O jogador clica no cliente para anotar o pedido
        function atenderCliente() {
            const index = Math.floor(Math.random() * bancoDePerguntas.length);
            perguntaAtual = bancoDePerguntas[index];
            
            // Atualiza a comanda da direita
            ui.textoPedido.innerText = `Quero uma pizza com a resposta para: ${perguntaAtual.pergunta}`;
            ui.statusTicket.innerText = "Aguardando...";
            
            // Mostra a comanda física em cima do balcão
            ui.comandaFisica.style.display = 'flex';
        }

        // O jogador clica na comanda física em cima do balcão
        function pegarComanda() {
            ui.comandaFisica.style.display = 'none';
            ui.filaClientes.innerHTML = ''; // Limpa a fila para o próximo cliente
            irParaMontagem(); // Vai para a estação de montagem
        }

        function irParaMontagem() {
            ui.sidebar.innerHTML = '';
            perguntaAtual.opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'btn-ingrediente';
                btn.innerText = opcao;
                btn.onclick = () => verificarIngrediente(opcao, btn);
                ui.sidebar.appendChild(btn);
            });
            mudarEstacao('estacao-montagem');
        }

        function verificarIngrediente(opcao, btn) {
            if (opcao === perguntaAtual.correta) {
                btn.style.backgroundColor = '#4CAF50';
                btn.style.color = 'white';
                ui.pizzaMontagem.innerHTML = '<span style="font-size: 100px;">🍕</span>';
                document.querySelectorAll('.btn-ingrediente').forEach(b => b.disabled = true);
                document.getElementById('btn-montagem-feita').style.display = 'block';
            } else {
                btn.style.backgroundColor = '#d32f2f';
                btn.disabled = true;
            }
        }

        function irParaForno() {
            mudarEstacao('estacao-forno');
            document.getElementById('btn-montagem-feita').style.display = 'none';
        }

        function acionarForno() {
            if (ui.btnForno.innerText === "Colocar no Forno") {
                ui.btnForno.innerText = "Retirar Pizza";
                tempoForno = 0;
                intervalForno = setInterval(() => {
                    tempoForno += 2;
                    ui.barraForno.style.width = tempoForno + '%';
                    if (tempoForno < 40) ui.barraForno.style.backgroundColor = '#4CAF50';
                    else if (tempoForno < 70) ui.barraForno.style.backgroundColor = '#ffeb3b';
                    else ui.barraForno.style.backgroundColor = '#d32f2f';
                    if (tempoForno >= 100) { clearInterval(intervalForno); finalizarForno(); }
                }, 100);
            } else {
                clearInterval(intervalForno);
                finalizarForno();
            }
        }

        function finalizarForno() {
            ui.btnForno.disabled = true;
            if (tempoForno >= 40 && tempoForno <= 70) ui.pizzaForno.classList.add('dourada');
            else if (tempoForno > 70) ui.pizzaForno.classList.add('queimada');
            setTimeout(() => { mudarEstacao('estacao-corte'); }, 1500);
        }

        function entregarPizza() {
            moedas += 10;
            ui.moedas.innerText = moedas;
            ui.textoPedido.innerText = "Pedido Entregue! +10 Moedas";
            ui.statusTicket.innerText = "Finalizado!";
            
            // Reseta o jogo para o Lobby
            pizzariaAberta = false;
            ui.btnOpen.classList.remove('fechada'); // Mostra a placa OPEN de novo
            ui.btnForno.disabled = false;
            ui.btnForno.innerText = "Colocar no Forno";
            ui.pizzaForno.className = 'pizza-area';
            ui.barraForno.style.width = '0%';
            ui.pizzaMontagem.innerHTML = '';
            
            setTimeout(() => { mudarEstacao('estacao-pedido'); }, 2000);
        }

        function mudarEstacao(id) {
            document.querySelectorAll('.estacao').forEach(el => el.classList.remove('ativa'));
            document.getElementById(id).classList.add('ativa');
        }
    </script>
</body>
</html>
